<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Product Details
</title>

<link rel="stylesheet"
href="style.css">

<link rel="stylesheet"

href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="product-details-page">

    <div class="details-card">

        <img id="detailsImage">

        <div class="details-content">

            <h1 id="detailsName"></h1>

            <h2 id="detailsPrice"></h2>

            <p>

                Premium handmade jewellery crafted
                with elegant and luxury designs.

                Perfect for weddings,
                parties and special occasions.

            </p>

            <button id="detailsWhatsappBtn">

                <i class="fab fa-whatsapp"></i>

                Order On WhatsApp

            </button>

        </div>

    </div>

</div>

<script type="module"
src="product.js"></script>

</body>

</html>
